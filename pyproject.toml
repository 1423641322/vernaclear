[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vernaclear"
version = "0.1.0"
description = "Context-aware screenshot and chat abbreviation translator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials==6.10.3",
    "Pillow>=11,<13",
    "rapidocr>=3,<4",
    "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pyinstaller>=6.15,<7",
]

[project.scripts]
vernaclear = "vernaclear.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vernaclear = ["resources/*.json", "resources/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

